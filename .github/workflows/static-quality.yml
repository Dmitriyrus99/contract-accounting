name: static-quality

on:
  pull_request:
  push:
    branches: [main, "agent/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install static quality dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Reject whitespace errors in the change-set
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" =~ ^0+$ ]]; then
            git diff --check --root "${{ github.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            git diff --check "${{ github.event.before }}...${{ github.sha }}"
          else
            git diff --check --root "${{ github.sha }}"
          fi

      - name: Run deterministic static quality gate
        run: python scripts/quality_gate.py

      - name: Require an exact source version for release tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(python -c 'from contract_accounting import __version__; print(__version__)')"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Preserve built release candidates and static evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-quality-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*
            12_release_scope_matrix_v1.csv
            .quality/ruff_format_baseline.json
